name: "exp_baseline_expert_small"
description: "[SMALL MODEL] Expert-tuned baseline at α=0.5: sgd/lr=0.01/mom=0.9, no GA. Historical N=1 reference: ~83.7% final / 84.4% peak at N=1."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5
  DATASET_NAME: cifar10_small

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
