name: "ga_surrogate_alpha01"
description: "Per-client GA with shared surrogate (medium coupling) at alpha=0.1. Completes the coupling ladder on the extreme-heterogeneity boundary. CIFAR-10."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.1

  ENABLE_GA: true
  ENABLE_SURROGATE_GA: true
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
