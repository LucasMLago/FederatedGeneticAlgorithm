name: "exp_baseline_expert_femnist"
description: "Expert-tuned baseline on FEMNIST (Dirichlet α=0.5, 60k/10k subsample): sgd/lr=0.003/mom=0.9. lr is the LEAF-benchmark standard for the FEMNISTCNN architecture; 0.01 is too aggressive for the smaller 2-conv model and routinely diverges in early rounds."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  DATASET_NAME: femnist
  FEMNIST_TRAIN_SAMPLES: 60000
  FEMNIST_TEST_SAMPLES: 10000

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.003
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
