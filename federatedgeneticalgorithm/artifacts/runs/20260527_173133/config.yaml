name: "exp_k_baseline_naive_small"
description: "[SMALL MODEL] Exp K: naive adam/lr=1e-3 baseline at α=0.5 — what a non-FL data scientist would pick (~80.0% peak)."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5
  DATASET_NAME: cifar10_small

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.001
  DEFAULT_OPTIMIZER: adam
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.0
