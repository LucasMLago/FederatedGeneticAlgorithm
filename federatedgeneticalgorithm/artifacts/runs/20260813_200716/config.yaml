name: "ga_surrogate_smallcnn"
description: "Per-client GA with shared surrogate (medium coupling) on the 530K-parameter CNN. Completes the coupling ladder in the model-size ablation. CIFAR-10, alpha=0.5."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5
  DATASET_NAME: cifar10_small

  ENABLE_GA: true
  ENABLE_SURROGATE_GA: true
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
