name: "exp_e_fedga_random_pop"
description: "FedGA at α=0.5 with NO baseline seeding (random initial population). Diagnostic-phase Exp E control arm; pairs with exp_e_fedga.yaml (baseline-seeded treatment) to characterize the temporal cold-start bias."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: true
  ENABLE_FED_RANDOM_SEARCH: false
  ENABLE_FED_TPE: false
  FED_GA_POPULATION_SIZE: 4
  FED_GA_SEED_BASELINE: false
  FED_GA_USE_DELTA_FITNESS: false

  # DEFAULT_* still set so HYPERPARAMS-space samples can produce these values
  # via random init; they're just not inserted into population[0] deterministically.
  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
