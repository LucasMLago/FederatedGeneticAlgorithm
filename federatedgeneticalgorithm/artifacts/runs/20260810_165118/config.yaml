name: "exp_b_ga_per_client_surrogate_femnist"
description: "Per-client GA + surrogate on FEMNIST — medium-coupling regime on the second dataset, completing the three-regime comparison there. Mirrors exp_b_ga_per_client_femnist.yaml with ENABLE_SURROGATE_GA on, matching the CIFAR pairing exp_b_ga_per_client.yaml / exp_b_ga_per_client_surrogate.yaml."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  DATASET_NAME: femnist
  FEMNIST_TRAIN_SAMPLES: 60000
  FEMNIST_TEST_SAMPLES: 10000

  ENABLE_GA: true
  ENABLE_SURROGATE_GA: true
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.003
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
