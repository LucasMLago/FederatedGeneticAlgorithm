name: "fedex_cifar"
description: "FedEx (Khodak et al., 2021): the server keeps one categorical distribution per HP, every sampled client draws its own HP from it, and the distribution is updated by exponentiated gradient on the clients' held-out validation error. Reference defaults, no outer RS/SHA wrapper. CIFAR-10, alpha=0.5."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: false
  ENABLE_FED_RANDOM_SEARCH: false
  ENABLE_FED_TPE: false
  ENABLE_FEDEX: true
  FEDEX_SCHED: aggressive

  # expert HPs; FedEx starts from uniform distributions, so these are not used
  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
