name: "exp_b_ga_per_client_surrogate"
description: "Per-client GA + surrogate at α=0.5 — the treatment arm of the surrogate ablation. Matches the diagnostic-session Exp B configuration (cenário ga_1_surrogate_1) used in the 11 historical runs."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: true
  ENABLE_SURROGATE_GA: true
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
