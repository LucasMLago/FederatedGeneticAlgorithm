name: "exp_e_fedga_femnist"
description: "FedGA on FEMNIST — high-coupling regime (server broadcasts one HP per round).Initial population seeded with the expert HP so the GA either keeps it or evolves away."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  DATASET_NAME: femnist
  FEMNIST_TRAIN_SAMPLES: 60000
  FEMNIST_TEST_SAMPLES: 10000

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: true
  FED_GA_POPULATION_SIZE: 4

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.003
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
