name: "exp_random_search"
description: "Server-side Random Search baseline at α=0.5 — non-GA baseline that shares the same coupling regime as FedGA (one HP per round, broadcast to all clients).LOCKED + §9.2 R3 mitigation (single non-GA baseline is a single point of failure for the paper)."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: false
  ENABLE_FED_RANDOM_SEARCH: true
  ENABLE_FED_TPE: false
  FED_GA_POPULATION_SIZE: 4

  # Baseline-seed: the expert HP is the first sample, so RS gets a fair shot
  # at "if you happened to draw the expert config, would you keep it?".
  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
