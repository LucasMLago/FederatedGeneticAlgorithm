# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
#
# Runtime knobs (rounds, fraction-train, local-epochs, partition mode,
# GA toggles, etc.) live in federatedgeneticalgorithm/config/config.py.
# This file only carries what Flower's CLI strictly needs.
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federatedgeneticalgorithm"
version = "1.0.0"
requires-python = "==3.10.0"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "deap>=1.4.3",
    "flwr-datasets>=0.5.0",
    "flwr[simulation]>=1.23.0",
    "lion-pytorch>=0.2.3",
    "matplotlib>=3.10.0",
    "optuna>=4.8.0",
    "pandas>=2.3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.7.2",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "lucas"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "federatedgeneticalgorithm.server_app:app"
clientapp = "federatedgeneticalgorithm.client_app:app"

# Default federation to use when running the app
[tool.flwr.federations]
default = "local-simulation"

# CPU simulation — default (10 virtual clients, no GPU allocation).
# Keys must live under `options.backend` so `flwr run` forwards them to Ray
# via --backend-config. At the top level (`backend.client-resources`) the CLI
# silently ignores them and Ray falls back to num_gpus=0 → training runs on CPU.
# Ray's Python API also expects snake_case (num_cpus / num_gpus), not kebab-case.
[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
options.backend.client-resources = { num_cpus = 2, num_gpus = 0.0 }

# GPU simulation — use on machines with a CUDA GPU (e.g. Google Colab T4).
# num_gpus = 0.5 lets up to 2 clients share the GPU simultaneously;
# lower (e.g. 0.2) for more concurrency, or raise to 1.0 for full isolation.
[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 10
options.backend.client-resources = { num_cpus = 2, num_gpus = 0.5 }

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true  # Remove this line to enable TLS
# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup
