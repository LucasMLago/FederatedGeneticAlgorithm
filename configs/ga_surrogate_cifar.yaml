name: "ga_surrogate_cifar"
description: "Per-client GA with a shared surrogate filter, medium coupling: a model trained on the pooled evaluation history pre-filters candidates before real evaluation. CIFAR-10, alpha=0.5."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: true
  ENABLE_SURROGATE_GA: true
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
