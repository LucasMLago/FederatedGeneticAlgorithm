name: "fixed_expert_cifar"
description: "Fixed expert-tuned HPs (sgd, lr=0.01, momentum 0.9), no search. CIFAR-10, Dirichlet alpha=0.5. Upper anchor of the comparison."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
