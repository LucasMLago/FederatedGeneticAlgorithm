name: "ga_broadcast_cifar_r40"
description: "Same as ga_broadcast_cifar with 40 rounds."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 40
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: true
  FED_GA_POPULATION_SIZE: 4

  # expert HPs, also used as the first individual of the GA population
  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9

  # fitness on the held-out split, not the test set
  FED_FITNESS_SPLIT: val
