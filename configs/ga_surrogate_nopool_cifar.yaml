name: "ga_surrogate_nopool_cifar"
description: "Surrogate GA where each client's surrogate is trained only on its own samples (no shared pool). Ablation of ga_surrogate_cifar."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: true
  ENABLE_SURROGATE_GA: true
  ENABLE_FED_GA: false

  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9

  GA_EVOLVE_POPULATION: true
  SURROGATE_SHARED_POOL: false
