name: "ga_broadcast_cifar"
description: "Server-broadcast GA, high coupling: the server evolves one HP population and broadcasts one configuration per round to all clients; fitness is the post-aggregation eval accuracy. Initial population seeded with the expert HPs. CIFAR-10, alpha=0.5."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: true
  FED_GA_POPULATION_SIZE: 4

  # Defaults still used to seed the initial FedGA population with the
  # textbook expert HP, so the GA either keeps it or evolves away.
  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
