name: "tpe_broadcast_cifar"
description: "TPE under the broadcast protocol: candidates proposed by a Tree-structured Parzen Estimator over the shared evaluation history. Same budget as the GA. CIFAR-10, alpha=0.5."

overrides:
  SEED: 0
  NUM_SERVER_ROUNDS: 20
  LOCAL_EPOCHS: 8
  FRACTION_TRAIN: 0.5
  PARTITION_MODE: dirichlet
  DIRICHLET_ALPHA: 0.5

  ENABLE_GA: false
  ENABLE_SURROGATE_GA: false
  ENABLE_FED_GA: false
  ENABLE_FED_RANDOM_SEARCH: false
  ENABLE_FED_TPE: true
  FED_GA_POPULATION_SIZE: 4

  # TPE ignores seed_individuals by design (see federated_baselines.py); the
  # first ~10 rounds are random startup trials per optuna's default. Keeping
  # DEFAULT_* aligned with the expert config for log readability only.
  DEFAULT_BATCH_SIZE: 64
  DEFAULT_LR: 0.01
  DEFAULT_OPTIMIZER: sgd
  DEFAULT_WEIGHT_DECAY: 0.0
  DEFAULT_MOMENTUM: 0.9
